[package]
name = "polars_sexp"
version = "0.1.0"
edition = "2021"

[lib]
name = "polars_sexp"
crate-type = ["cdylib", "rlib"]

[dependencies]
polars = { version = "0.55", default-features = false, features = ["dtype-struct", "dtype-i8", "dtype-i16", "dtype-u8", "dtype-u16", "dtype-date", "dtype-datetime", "dtype-duration", "dtype-array", "timezones"] }
pyo3 = { version = "0.29", features = ["abi3-py39"] }
pyo3-polars = { version = "0.28", features = ["derive", "dtype-struct", "dtype-array"] }
chrono = "0.4"
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
