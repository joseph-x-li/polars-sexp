[package]
name = "polars_sexp"
version = "0.1.0"
edition = "2021"

[lib]
name = "polars_sexp"
crate-type = ["cdylib", "rlib"]

[dependencies]
polars = { version = "0.55", default-features = false }
pyo3 = { version = "0.29", features = ["abi3-py39"] }
pyo3-polars = { version = "0.28", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
