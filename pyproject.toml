[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "polars-sexp"
version = "0.1.1"
description = "Parse S-expressions in Polars"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Joseph Li" }]
keywords = ["polars", "s-expression", "sexp", "parser", "plugin"]
requires-python = ">=3.10"
dependencies = ["polars>=2.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Text Processing :: General",
]

[project.urls]
Homepage = "https://github.com/joseph-x-li/polars-sexp"
Repository = "https://github.com/joseph-x-li/polars-sexp"
Issues = "https://github.com/joseph-x-li/polars-sexp/issues"

[project.optional-dependencies]
dev = ["pytest"]

[tool.maturin]
module-name = "polars_sexp._internal"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
